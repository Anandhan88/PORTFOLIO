<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="180" height="48" viewBox="0 0 180 48" role="img" aria-label="ANAND logo">
  <defs>
    <linearGradient id="editorialGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>
  <!-- Architectural Square Monogram A -->
  <rect x="2" y="2" width="44" height="44" fill="none" stroke="url(#editorialGrad)" stroke-width="2" />
  <text x="24" y="34" font-family="'Times New Roman', Times, serif" font-size="30" font-weight="900" text-anchor="middle" fill="#00e5ff">A</text>
  <!-- Minimalist Wordmark -->
  <text x="58" y="32" font-family="'Times New Roman', Times, serif" font-size="22" font-weight="700" letter-spacing="4" fill="#ffffff">ANAND</text>
</svg>
